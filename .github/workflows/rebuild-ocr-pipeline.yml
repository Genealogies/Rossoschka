name: Rebuild OCR Pipeline

on:
  workflow_dispatch:   # manual trigger
  pull_request:        # run on every PR to validate pipeline output changes

jobs:
  rebuild:
    runs-on: macos-15  # Apple Silicon (ARM64) — required for Apple Vision OCR Swift scripts
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true          # fetch any Git LFS objects (snapshots etc.)
          fetch-depth: 1     # shallow clone — full history not needed

      - name: Show runner info
        run: |
          uname -m
          swift --version
          python3 --version

      - name: Run rebuild pipeline
        run: ./rebuild_pipeline.sh

      - name: Show diff summary
        if: always()
        run: git diff --stat

      - name: Show full diff
        if: always()
        run: |
          git --no-pager diff
          if ! git diff --quiet; then
            echo "ERROR: Unexpected changes detected in working tree"
            exit 1
          fi

      - name: Zip changed files
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t changed < <(git diff --name-only)
          mapfile -t untracked < <(git ls-files --others --exclude-standard)
          all=("${changed[@]}" "${untracked[@]}")
          if [ ${#all[@]} -gt 0 ]; then
            zip changed_files.zip "${all[@]}"
          else
            echo "No changed files to zip"
          fi

      - name: Upload changed files artifact
        if: github.event_name == 'pull_request' && hashFiles('changed_files.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: changed-files
          path: changed_files.zip
